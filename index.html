<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./assets/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
</head>
<body class="">

    <nav>
        <div class="container-nav">
            <img src="./assets/icons/messages.svg" alt="WhatsApp Logo"> 
            <img src="./assets/icons/status.svg" alt="WhatsApp Logo">
            <img src="./assets/icons/newsletter.svg" alt="WhatsApp Logo"> 
            <img src="./assets/icons/community.svg" alt="WhatsApp Logo">  
        </div>
        <div class="container-nav">
            <img src="./assets/icons/settings.svg" alt="WhatsApp Logo">
            <img src="https://i.pravatar.cc/150?img=3" alt="WhatsApp Logo">
        </div>
    </nav>

    <section>
        <div class="container-stick">
            <div class="container-titulo">
                <h1>WhatsApp</h1>
                <div class="btn-new-chat">
                    <img src="./assets/icons/new-chat.svg" alt="WhatsApp Logo">
                    <img src="./assets/icons/more-settings.svg" alt="WhatsApp Logo">
                    </div>
            </div>
            <form action="">
                <input type="text" placeholder="Pesquisar ou começar uma nova conversa">
            </form>
            <div class="btn-container">
                <button>Tudo</button>
                <button>Não lida</button>
                <button> Favoritas</button>
                <button>Grupos</button>
                </div>  
            </div>
    </section>
    <main></main> 
</body>
</html>
