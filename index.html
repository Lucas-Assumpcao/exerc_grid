<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./assets/style.css">
    <script src="./script.js" defer type="module"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
</head>
<body>

    <nav>
        <div class="container-nav">
            <img src="./assets/icons/messages.svg" alt="WhatsApp Logo">
            <img src="./assets/icons/status.svg" alt="WhatsApp Logo">
            <img src="./assets/icons/newsletter.svg" alt="WhatsApp Logo">
            <img src="./assets/icons/community.svg" alt="WhatsApp Logo">
        </div>
        <div class="container-nav">
            <img src="./assets/icons/settings.svg" alt="WhatsApp Logo">
            <img src="https://i.pravatar.cc/150?img=3" alt="WhatsApp Logo">
        </div>
    </nav>

    <section>
        <div class="container-stick">
            <div class="container-titulo">
                <h1>WhatsApp</h1>
                <div class="btn-new-chat">
                    <img src="./assets/icons/new-chat.svg" alt="Nova conversa">
                    <img src="./assets/icons/more-settings.svg" alt="Mais opções">
                </div>
            </div>

            <form action="">
                <input type="text" placeholder="Pesquisar ou começar uma nova conversa">
            </form>

            <div class="btn-container">
                <button>Tudo</button>
                <button>Não lida</button>
                <button>Favoritas</button>
                <button>Grupos</button>
            </div>

            <div class="chat-list">
    <!-- os contatos vão ser inseridos aqui via JS -->
            </div>      
        </div>
    </section>

    <main class="chat-main">
        <div class="chat-shell">
            <header class="chat-topbar">
                <img class="avatar" src="https://i.pravatar.cc/150?img=41" alt="Ana">
                <div class="contact-info">
                    <h2>Ana</h2>
                    <p>online</p>
                </div>
            </header>

            <section class="chat-messages">
                <div class="message received">Oi! Tudo bem?</div>
                <div class="message sent">Tudo sim, e você?</div>
                <div class="message received">Que bom! Vamos ao treino hoje?</div>
            </section>

            <footer class="chat-input">
    <form id="form-send-msg">
        <input type="text" id="input-send-msg" placeholder="Digite uma mensagem">
        <button type="submit">Enviar</button>
    </form>
</footer>
        </div>
    </main>
</body>bbbbbb
</html>
