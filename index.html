<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./assets/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
</head>
<body class="">

    <nav>
        <div class="container-nav">
            <img src="./assets/icons/messages.svg" alt="WhatsApp Logo"> 
            <img src="./assets/icons/status.svg" alt="WhatsApp Logo">
            <img src="./assets/icons/newsletter.svg" alt="WhatsApp Logo"> 
            <img src="./assets/icons/community.svg" alt="WhatsApp Logo">  
        </div>
        <div class="container-nav">
            <img src="./assets/icons/settings.svg" alt="WhatsApp Logo">
            <img src="https://i.pravatar.cc/150?img=3" alt="WhatsApp Logo">
        </div>
    </nav>

    <section>
        <div class="container-stick">
            <div class="container-titulo">
                <h1>WhatsApp</h1>
                <div class="btn-new-chat">
                    <img src="./assets/icons/new-chat.svg" alt="Nova conversa">
                    <img src="./assets/icons/more-settings.svg" alt="Mais opções">
                </div>
            </div>

            <form action="">
                <input type="text" placeholder="Pesquisar ou começar uma nova conversa">
            </form>

            <div class="btn-container">
                <button>Tudo</button>
                <button>Não lida</button>
                <button>Favoritas</button>
                <button>Grupos</button>
            </div>

            <div class="chat-list">
                <article class="chat-card active">
                    <img class="avatar" src="https://i.pravatar.cc/150?img=41" alt="Contato Ana">

                    <div class="chat-content">
                        <div class="chat-header">
                            <h2>Ana</h2>
                            <span>18:42</span>
                        </div>

                        <div class="chat-footer">
                            <p>Vou mandar o arquivo final agora.</p>
                            <span class="badge">2</span>
                        </div>
                    </div>
                </article>

                <article class="chat-card">
                    <img class="avatar" src="https://i.pravatar.cc/150?img=12" alt="Contato Bruno">

                    <div class="chat-content">
                        <div class="chat-header">
                            <h2>Bruno</h2>
                            <span>17:25</span>
                        </div>

                        <div class="chat-footer">
                            <p>Já revisou o layout do projeto?</p>
                            <span class="badge muted">5</span>
                        </div>
                    </div>
                </article>

                <article class="chat-card">
                    <img class="avatar" src="https://i.pravatar.cc/150?img=5" alt="Contato Carla">

                    <div class="chat-content">
                        <div class="chat-header">
                            <h2>Carla</h2>
                            <span>Ontem</span>
                        </div>

                        <div class="chat-footer">
                            <p>Preciso de mais detalhes sobre a entrega.</p>
                            <span class="badge muted">1</span>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </section>
</body>
</html>
